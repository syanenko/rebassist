  <body>
    </script> 
    <div>
      <img id="logo" src="data/images/rebelle_logo.png" alt="Logo" height="40" onclick="window.location.reload()">
      <div id="text" onclick="window.location.reload()">Rebelle assistant</div>
      <img id="help" class="buttons" src="data/images/help_36x36.png" style="opacity: 0.65" alt="Help" onclick="about.inert=true;  about.showModal(); about.inert=false;">

    <dialog id="about" style="width:420px;">
      <div style="font-size: 24px; color:#fff; font-style: italic;">Rebelle assistant</div><br>
      Converts SVG files with flattened paths<br>('M' and 'L' commands) to <a href="https://www.escapemotions.com/products/rebelle/motionio_doc/" target="_blank" rel="noopener noreferrer"><i>MotionIO</i></a> events and sends to <a href="https://www.escapemotions.com/products/rebelle/about" target="_blank" rel="noopener noreferrer"><i>Rebelle 8 Pro</i></a> via websocket.<br><br>
      <a href="https://yesbird.online/" target="_blank" rel="noopener noreferrer">(c) Yesbird studio 2026</a><br><br>
        <form method="dialog" style="text-align:center">
        <button>&nbsp;&nbsp;&nbsp;OK&nbsp;&nbsp;&nbsp;</button>
        </form>
    </dialog>

    <script type="module" src="main.js"></script>

    <div id="container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%)"></div>

    <div style='position: absolute; top:65px; left:10px; width:90px; z-index:4;'>
      <input type="image" src='data/svg/rebelle_logo.svg' class='icon' onclick="loadSVG('./data/svg/rebelle_logo.svg')">
      <input type="image" src='data/svg/bull.svg' class='icon' onclick="loadSVG('./data/svg/bull.svg')">
      <input type="image" src='data/svg/yes.svg' class='icon' onclick="loadSVG('./data/svg/yes.svg')">
    </div>

    <script>
      window.onload = function() {
        loadSVG("./data/svg/bull.svg");
      };
    </script>
