<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Studio</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="expires" content="timestamp">
    <link type="text/css" rel="stylesheet" href="main.css">
  </head>

  <body>
    <script type="importmap"> { 
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/",
        "three/nodes": "/node_modules/three/examples/jsm/nodes/Nodes.js"
        }
    }
    </script> 
    <div>
    <img id="logo" src="data/images/rebelle_logo.png" alt="Logo" height="40" onclick="about.inert=true; about.showModal(); about.inert=false;">
    <div id="text" onclick="about.inert=true;  about.showModal(); about.inert=false;">SVG to MotionIO converter</div>
    <img id="help" class="buttons" src="data/images/help_36x36.png" alt="Help" onclick="about.inert=true;  about.showModal(); about.inert=false;">
    </div>
    <hr>

    <!-- About -->
    <dialog id="about" style="width:500px;">
      <div style="font-size: 24px; color:#ff9127">SVG to MotionIO converter</div><br>
      Text text text text text text text text text text text text text text text text text text 
      text text text text text text text text.<br><br>
      <a href="https://yesbird.online/" target="_blank" rel="noopener noreferrer">Yesbird studio</a>
            <form method="dialog" style="text-align:center">
        <button>&nbsp;&nbsp;&nbsp;OK&nbsp;&nbsp;&nbsp;</button>
      </form>
    </dialog>

    <!-- Download -->
    <dialog id="download_dlg" class="dialog" style="text-align: center;">
      <div style="font-size: 20px; font-style: italic; color:#ff9127; padding-bottom: 10px;">Download</div>
      <button id="glb"  class="control" onclick="download(this.id);download_dlg.close()" title="GLB">GLB</button>
      <button id="gltf" class="control" onclick="download(this.id);download_dlg.close()" title="GLTF">GLTF</button>
      <button id="pov"  class="control" onclick="download(this.id);download_dlg.close()" title="POV">POV</button>
      <button id="cancel" class="control" onclick="download_dlg.close()" title="Cancel">Cancel</button>
    </dialog>

    <!-- Main -->
    <script type="module" src="main.js"></script>
 
    <!-- Upload model -->
    <div id="form_upload" style="width:370px">
      <form encType="multipart/form-data" style="text-align:left">
        <h3>Upload SVG file</h3>
        <input type="file" id="model" name="model"  accept=".svg"/><br/><br/>
        <input type="submit"  id="Upload" value="Upload" />&nbsp;&nbsp;&nbsp;&nbsp;
        <input type="button"  id="Cancel" value="Cancel" onclick="parentElement.parentElement.style.visibility = 'hidden'"/>
      </form>
    </div>

    <!-- Container -->
    <div id="container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%)">QQ</div>
    <script>
      function loadSVG(svg) {
        const container = document.getElementById('container');
        fetch(svg)
          .then(response => response.text())
          .then(svgText => {
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
            const svgElement = svgDoc.querySelector('svg');

            if (svgElement && container) {
              container.replaceChildren();
              container.appendChild(svgElement);
            }
          });
      }

      var form = document.getElementById('form_upload');
      form.addEventListener('submit', function(e) {
        // Display progress bar
        // document.getElementById('progress-label').innerHTML = "Loading...";
        // document.getElementById('progress-container').style.display = 'flex';
        let progress = document.getElementById('progress-bar');
        
        // Prevent the default form submission behavior
        e.preventDefault();

        // Create a new FormData object
        var formData = new FormData();

        // Get the selected file
        var model = form.querySelector('[name="model"]').files[0];

        // Add the file to the FormData object
        formData.append('model', model);

        // XMLHttpRequest object
        var xhr = new XMLHttpRequest();

        // Set the request url - check it before publishing
        xhr.open('POST', 'https://127.0.0.1:8089/upload.php');
        // xhr.open('POST', 'https://yesbird.online/rebelle/svg2mio/upload.php');

        // Set the request onload event listener
        xhr.responseType = 'json';

        xhr.upload.addEventListener('progress', (event) => {
        if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            progress.value = percent;
            progress.textContent = `${percent}%`;
        }
        });

        xhr.onload = function() {
          if (xhr.status === 200) {
            loadSVG(xhr.response.model);
          } else {
              alert("Error loading model: " + xhr.status);
              document.getElementById('progress-container').style.display = 'none';
          }
        }

        xhr.onerror = function() {
          alert("Error loading model, see console for details");
          document.getElementById('progress-container').style.display = 'none';
        }

        // Send the request
        xhr.send(formData);
        form.style.visibility = 'hidden';
      });
    </script>

    <!-- Model -->
    <div id="container"></div>

    <!-- Controls -->
    <div style='position: absolute; top:60px; left:10px; width:800px; z-index:4;'>
      <input id="upload_button" type="image" src='data/images/upload_icon.png' class="icon">
      <input type="image" src='data/svg/bull.svg' class='icon' onclick="loadSVG('./data/svg/bull.svg')">
      <input type="image" src='data/svg/rebelle.svg' class='icon' onclick="loadSVG('./data/svg/rebelle.svg')">
      <input type="image" src='data/svg/yes.svg' class='icon' onclick="loadSVG('./data/svg/yes.svg')">
    </div>

    <div style='position: absolute; top:165px; left:10px; width:90px; z-index:4;'>
      <input id="download_button" type="image" src='data/images/download_icon.png' onclick="download_dlg.inert=true; download_dlg.showModal(); download_dlg.inert=false;" class="icon">
    </div>

    <script>
      ub = document.getElementById("upload_button");
      ub.onclick = function() { let form = document.getElementById("form_upload");
                                form.style.visibility == "visible" ? form.style.visibility = 'hidden': form.style.visibility = "visible"; }

      window.onload = function() {
        loadSVG("./data/svg/bull.svg");
      };
    </script>

    <!-- Stat
    <div style='position: absolute; bottom:15px; left:20px; z-index:4; font-size: 130%;'>
      <div id="status">Please upload SVG file</div>
    </div>
    -->

    <!-- Progress -->
    <div id="progress-container">
      <label id="progress-label" for="progress-bar"></label>
      <progress id="progress-bar" value="0" max="100"></progress>
    </div>

  </body>
</html>
