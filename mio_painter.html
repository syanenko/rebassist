<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MIO Painter</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="expires" content="timestamp">

    <!-- Codemirror -->
    <script src="./node_modules/codemirror/lib/codemirror.js"></script>
    <script src="./node_modules/codemirror/mode/clike/clike.js"></script>
    <link rel="stylesheet" href="./node_modules/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="./node_modules/codemirror/theme/abcdef.css">
    <link type="text/css" rel="stylesheet" href="mio_painter.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>

  <dialog id="about" style="width:420px;">
    <div style="font-size: 24px; color:#fff; font-style: italic;">MotionIO Painter</div><br>
    Edit <a href="https://www.escapemotions.com/products/rebelle/motionio_doc/" target="_blank" rel="noopener noreferrer"><i>MotionIO</i></a> events and send them to <i>Rebelle</i>.
    Please refer to <a href="https://www.escapemotions.com/products/rebelle/manual/8.2/starting-painting/websocket/" target="_blank" rel="noopener noreferrer"><i>Rebelle 8 Pro manual</i></a> to setup websocket interface before using.
    <br><br>
    <a href="https://yesbird.online/" target="_blank" rel="noopener noreferrer">(c) Yesbird studio 2026</a><br><br>
      <form method="dialog" style="text-align:center">
      <button>&nbsp;&nbsp;&nbsp;OK&nbsp;&nbsp;&nbsp;</button>
      </form>
  </dialog>

  <script type="module" src="mio_painter.js"></script>

  <div>
    <img id="logo" src="./data/images/rebelle_logo_white.png" alt="Logo" height="45" onclick="window.location.reload()">
    <div id="text" onclick="window.location.reload()" style="color: white">MotionIO Painter</div>
    <img id="load" class="control" src="./data/images/load_48.svg" title="Load [Ctrl-L]" style="right:172px; width:42px" alt="Load" onclick="loadPicker()">
    <img id="save" class="control" src="./data/images/save_48.svg" title="Save [Ctrl-S]" style="right:117px; width:42px" alt="Save" onclick="window.save()">
    <img id="paint" class="control" src="./data/images/paint_48.svg" title="Paint [Ctrl-P]" style="right:63px; width:42px" alt="Paint" onclick="window.paint()">
    <img id="help" class="control" src="./data/images/help_48.svg" title="Paint [Ctrl-P]" style="right:10px; width:42px" alt="Help" onclick="about.inert=true; about.showModal(); about.inert=false;">
  </div>
  <hr>
  
  <!-- CodeMirror -->
  <textarea id="code" name="code" wrap="off"></textarea>
  <script>
    window.editor = CodeMirror.fromTextArea(code, {
      lineNumbers: true,
      theme: 'abcdef',
      mode:  "clike"
    });
  </script>
 
  <script>
    // Send by 'Ctrl-S'
    document.addEventListener("keydown", function keydown (event) {
        if (navigator.platform === "MacIntel" ? event.metaKey : event.ctrlKey) {
            event.preventDefault()
            if(event.key === "p") {
              window.setStatus("Sending events");
              window.paint();
           } else if(event.key === "l") {
              window.setStatus("Loading ...");
              loadPicker();
              window.setStatus("Loaded");
           } else if(event.key === "s") {
              window.setStatus("Saving ...");
              window.save();
              window.setStatus("Saved");
           }
        }
    })
  </script>

  <script>
    function loadScript(url) {
    url = "./data/mio/" + url;
    const options = {
      headers: {
      }
    };

    fetch(url, options)
      .then(function(response) {
        response.text().then(function(text) {
          editor.getDoc().setValue(text);
          code.scrollTo(0, 0);
        });
      });
    }

    // Load file with picker
    async function loadPicker() {
      try {
        const options = {
          types: [
            {
              description: 'Motion IO',
              accept: {
                'text/json': ['.mio']
              }
            },
          ],
          excludeAcceptAllOption: false,
          multiple: false,
        };
        const [fileHandle] = await window.showOpenFilePicker(options);
        const file = await fileHandle.getFile();
        const text = await file.text();

        editor.getDoc().setValue(text);
        code.scrollTo(0, 0);
        lsRender();
      } catch(err) {
      }
    }
  </script>

  <!-- Buttons -->
  <div class="buttons">
    <button id="1" onclick="loadScript('debug.mio')" title="Quick test">Debug</button>
    <button id="2" onclick="loadScript('longtest.mio')"  title="Long test">Long test</button>
    <button id="3" onclick="loadScript('bull.mio')",     title="Bull">Bull</button>
    <button id="4" onclick="loadScript('plant_1.mio')",  title="Plant 1">Plant 1</button>
    <button id="5" onclick="loadScript('plant_2.mio')",  title="Plant 2">Plant 2</button>
    <button id="6" onclick="loadScript('plant_3.mio')",  title="Plant 3">Plant 3</button>
    <button id="7" onclick="loadScript('plant_4.mio')",  title="Plant 4">Plant 4</button>
    <button id="8" onclick="loadScript('liana_1.mio')",  title="Liana 1">Liana 1</button>
    <button id="9" onclick="loadScript('liana_2.mio')",  title="Liana 2">Liana 2</button>
  </div>

  <div id="status" style="position: absolute; bottom:3px; color:#fff; background-color: #333; width:100%; padding-left: 8px; font-size: 18px;">Ready</div>

  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if(id) {
        document.getElementById(id).click();
      } else {
        document.getElementById("1").click();
      }
    };
  </script>

  </body>
</html>
