<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SVG</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="expires" content="timestamp">
    <link type="text/css" rel="stylesheet" href="index.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>

  <body>
    <div>
      <img id="logo" src="data/images/rebelle_logo_white.png" alt="Logo" height="45" onclick="window.location.reload()">
      <div id="text" onclick="window.location.reload()">SVG Painter</div>
      <img id="paint" class="control" src="./data/images/paint_48.svg" title="Paint [Ctrl-P]" style="right:110px; width:42px" alt="Paint" onclick="window.paint()">
      <img id="load" class="control" src="./data/images/load_48.svg" title="Load [Ctrl-L]" style="right:60px; width:42px" alt="Load" onclick="loadSVGPicker()">
      <img id="help" class="control" src="data/images/help_48.svg" title="Help [Ctrl-H]" style="right:8px; width:42px" alt="Help" onclick="about.inert=true; about.showModal(); about.inert=false;">
    </div>
    <hr>

    <dialog id="about" style="width:420px;">
      <div style="font-size: 24px; color:#fff; font-style: italic;">Rebelle SVG Painter</div><br>
      Convert SVG files with flattened paths<br>('M' and 'L' commands) to <a href="https://www.escapemotions.com/products/rebelle/motionio_doc/" target="_blank" rel="noopener noreferrer"><i>MotionIO</i></a> events and send to <i>Rebelle</i>.
      Please refer to <a href="https://www.escapemotions.com/products/rebelle/manual/8.2/starting-painting/websocket/" target="_blank" rel="noopener noreferrer"><i>Rebelle 8 Pro manual</i></a> to setup <i>websocket</i> interface before using.<br><br>
      <a href="https://yesbird.online/" target="_blank" rel="noopener noreferrer">(c) Yesbird studio 2026</a><br><br>
        <form method="dialog" style="text-align:center">
        <button>&nbsp;&nbsp;&nbsp;OK&nbsp;&nbsp;&nbsp;</button>
        </form>
    </dialog>

    <script type="module" src="svg_painter.js"></script>

    <div id="container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%)"></div>
    <div style='position: absolute; top:65px; left:10px; width:310px; z-index:4;'>
      <input type="image" src='data/svg/rebelle_logo.svg' class='icon' onclick="loadSVG('./data/svg/rebelle_logo.svg')">
      <input type="image" src='data/svg/bull.svg' class='icon' onclick="loadSVG('./data/svg/bull.svg')">
      <input type="image" src='data/svg/celtic_knot.svg' class='icon' onclick="loadSVG('./data/svg/celtic_knot.svg')">
      <input type="image" src='data/svg/castle_2.svg' class='icon' onclick="loadSVG('./data/svg/castle_2.svg')">
      <input type="image" src='data/svg/sketch_03.svg' class='icon' onclick="loadSVG('./data/svg/sketch_03.svg')">
      <input type="image" src='data/svg/sketch_06.svg' class='icon' onclick="loadSVG('./data/svg/sketch_06.svg')">   
      <input type="image" src='data/svg/sketch_01.svg' class='icon' onclick="loadSVG('./data/svg/sketch_01.svg')">
      <input type="image" src='data/svg/sketch_02.svg' class='icon' onclick="loadSVG('./data/svg/sketch_02.svg')">
      <input type="image" src='data/svg/sketch_04.svg' class='icon' onclick="loadSVG('./data/svg/sketch_04.svg')">
      <input type="image" src='data/svg/sketch_11.svg' class='icon' onclick="loadSVG('./data/svg/sketch_11.svg')">
      <input type="image" src='data/svg/sketch_08.svg' class='icon' onclick="loadSVG('./data/svg/sketch_08.svg')">
      <input type="image" src='data/svg/sketch_09.svg' class='icon' onclick="loadSVG('./data/svg/sketch_09.svg')">
      <input type="image" src='data/svg/sketch_07.svg' class='icon' onclick="loadSVG('./data/svg/sketch_07.svg')">
      <input type="image" src='data/svg/sketch_05.svg' class='icon' onclick="loadSVG('./data/svg/sketch_05.svg')">
      <input type="image" src='data/svg/sketch_10.svg' class='icon' onclick="loadSVG('./data/svg/sketch_10.svg')">
    </div>

    <script>
      // On load
      window.onload = function() {
        const gui = document.querySelectorAll('[class*="lil-gui"]'); // GUI position
        gui[0].style.setProperty('right', '169px', 'important');

        loadSVG("./data/svg/rebelle_logo.svg");
      };

      // Shortcuts: DEBUG
      document.addEventListener("keydown", function keydown (event) {
        if (navigator.platform === "MacIntel" ? event.metaKey : event.ctrlKey) {
          event.preventDefault()

          if(event.key === "o") {
            loadSVGPicker();
          } else if(event.key === "r") {
            window.setStatus("Rendering ...");
            lsRender();
            window.setStatus("Rendered");
          } if(event.key === "p") {
            window.setStatus("Sending events ...");
            window.paint();
            window.setStatus("Sending completed");
          } else if(event.key === "s") {
            window.saveLS();
          }
        }
      })
   </script>

   <div id="status" style="position: absolute; bottom:3px; color:#fff; background-color: #333; width:100%; padding-left: 8px; font-size: 18px;">Ready</div>

  </body>
</html>
