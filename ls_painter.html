<!DOCTYPE html>
<html lang="en">
  <head>
    <title>L-Painter</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="expires" content="timestamp">

     <!-- Codemirror -->
    <script src="/node_modules/codemirror/lib/codemirror.js"></script>
    <script src="/node_modules/codemirror/mode/clike/clike.js"></script>
    <script src="/node_modules/codemirror/mode/javascript/javascript.js"></script>
    <link rel="stylesheet" href="/node_modules/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="cm_abcdef.css">
    <link rel="stylesheet" href="ls_painter.css">
  </head>
  <body>

  <dialog id="about" style="width:420px;">
    <div style="font-size: 24px; color:#fff; font-style: italic;">L-System Painter - Rebelle L-systems extension</div><br>
    Edit <a href="https://www.escapemotions.com/products/rebelle/motionio_doc/" target="_blank" rel="noopener noreferrer"><i>MotionIO</i></a> events send them to <a href="https://www.escapemotions.com/products/rebelle/about" target="_blank" rel="noopener noreferrer"><i>Rebelle 8 Pro</i></a> via websocket.<br><br>
    <a href="https://yesbird.online/" target="_blank" rel="noopener noreferrer">(c) Yesbird studio 2026</a><br><br>
      <form method="dialog" style="text-align:center">
      <button>&nbsp;&nbsp;&nbsp;OK&nbsp;&nbsp;&nbsp;</button>
      </form>
  </dialog>

  <script type="module" src="ls_painter.js"></script>

  <div>
    <img id="logo" src="./data/images/rebelle_logo_white.png" alt="Logo" height="45" onclick="window.location.reload()">
    <div id="text" onclick="window.location.reload()" style="color: white">L-System Painter</div>
<!--
    <img id="upload" class="control" src="./data/images/upload_48x48.png" title="Render [Ctrl-R]" style="right:180px" alt="Render" onclick="lsRender()">
    <img id="download" class="control" src="./data/images/save_48x48.png" title="Save [Ctrl-S]" style="right:120px" alt="Save" onclick="window.save()">
    <img id="upload" class="control" src="./data/images/upload_48x48.png" title="Paint [Ctrl-P]" style="right:60px" alt="Upload" onclick="window.paint()">
   <img id="help" class="control" src="./data/images/help_white_36x36.png" alt="Help" onclick="about.inert=true; about.showModal(); about.inert=false;">
-->
  </div>
  <hr>

  <div id="container" style="position: absolute; top: 50%; left: 50%; transform: translate(-90%, -50%)"></div>

  <!-- CodeMirror -->
  <textarea id="code" name="code" wrap="off"></textarea>
  <script>
    window.editor = CodeMirror.fromTextArea(code, {
      mode:  "javascript", // "clike"
      theme: 'abcdef',
      lineNumbers: true
      // lineWrapping: true
    });
  </script>

  <script src="/node_modules/lindsvg/dist/lindsvg.min.js"></script>
  <script>
    let {getSVGCode, getMultiPathSVGCode} = window.lindsvg; 

    // Render L-system from editor
    function lsRender() {
      const encodedCode = btoa(editor.getValue());
      const dataUri = `data:text/javascript;base64,${encodedCode}`;
      import(dataUri)
        .then((module) => {
          const cont = document.getElementById('container');
          cont.replaceChildren();
          cont.insertAdjacentHTML("beforeend", getMultiPathSVGCode(module.ls, module.svg));
          setSVG(cont.firstElementChild);
      }).catch((err) => {
        alert(err);
      });
    }

    // Load L-system into editor and render
    function lsLoad(url) {
      url = "./data/lsystems/" + url;
      const options = {
        headers: {
        }
      };
      fetch(url, options)
        .then(function(response) {
          response.text().then(function(text) {
            editor.getDoc().setValue(text);
            code.scrollTo(0, 0);
            lsRender();
          });
        });
    }

    // Load file with picker
    async function lsPickerLoad() {
      try {
        const [fileHandle] = await window.showOpenFilePicker();
        const file = await fileHandle.getFile();
        const text = await file.text();

        editor.getDoc().setValue(text);
        code.scrollTo(0, 0);
        lsRender();
      } catch(err) {
      }
    }

    // Shortcuts
    document.addEventListener("keydown", function keydown (event) {
      if (navigator.platform === "MacIntel" ? event.metaKey : event.ctrlKey) {
        event.preventDefault()

        if(event.key === "o") {
          lsPickerLoad();
        } else if(event.key === "r") {
          window.setStatus("Rendering ...");
          lsRender();
          window.setStatus("Rendered");
        } if(event.key === "p") {
          window.setStatus("Sending events ...");
          window.paint(); // DEBUG
          window.setStatus("Sending completed");
        } else if(event.key === "s") {
          window.saveLS();
        }
      }
    })

  </script>

  <!-- Buttons -->
  <div class="buttons">
    <button id="6" onclick="lsPickerLoad()"  title="Open L-System file">Open</button>
    <button id="1" onclick="lsLoad('test_single.mjs')" title="test_single">1</button>
    <button id="2" onclick="lsLoad('test_single_01.mjs')" title="test_single_01">2</button>
    <button id="3" onclick="lsLoad('test_single_02.mjs')" title="test_single_02">3</button>
    <button id="4" onclick="lsLoad('test_multy.mjs')"  title="test_multy">4</button>
  </div>

  <div id="status" style="position: absolute; bottom:3px; color:#fff; background-color: #333; width:100%; padding-left: 8px; font-size: 18px;">Ready</div>

  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if(id) {
        document.getElementById(id).click();
      } else {
        document.getElementById("2").click();
      }
    };
  </script>

  </body>
</html>
